# ===================================================================================
# CLI Proxy API (ai-core2) - CI/CD PIPELINE
# ===================================================================================
#
# Mengikuti pattern vps-deployment (lihat docs/CICD-DEPLOYMENT.md di repo
# vps-deployment): build → push GHCR → SSH deploy via appleboy/ssh-action.
#
# Container baca config dari S3 (Cloudflare R2) saat startup pakai
# OBJECTSTORE_* env, jadi WORKFLOW TIDAK menulis config.yaml lagi —
# .env adalah satu-satunya secret yang dipush per deploy. Ini menyamakan
# alur dengan repo Genfity lainnya (lihat genfity-app, genfity-order-main).

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip build, deploy existing image'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cli-proxy-api
  APP_DIR: /home/cicddeploy/genfity/ai-core2

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_only != 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || github.event.inputs.deploy_only == 'true') &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Sync repository — keep working tree aligned with main so
            # docker-compose.yml + Dockerfile updates flow through automatically.
            #
            # static/ and auths/ are bind-mounted into the container as root,
            # which makes them undeletable by the cicddeploy user during a
            # `git reset --hard`. Re-chown the working tree first; the docker
            # daemon will re-acquire root ownership on the next container
            # write since the bind mount is to a directory the daemon owns.
            sudo chown -R cicddeploy:cicddeploy . || true
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e static -e auths -e .env -e config.yaml -e config.yaml.backup.* -e .env.backup.* -e objectstore-config

            # Full .env replacement from secret (matches Genfity convention).
            # Container reads OBJECTSTORE_* from .env at startup and pulls
            # config.yaml from R2; no separate CONFIG_YAML secret needed.
            cat > .env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF
            chmod 600 .env

            # Login to GHCR so docker compose pull can fetch the freshly
            # pushed image.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u mygads --password-stdin

            # Pull latest image when available. Some hosts still resolve this
            # service as build-based or can temporarily reference a missing
            # registry digest; in that case rebuild from the just-synced source
            # tree instead of failing the whole deploy.
            if ! docker compose pull cli-proxy-api; then
              echo "docker compose pull failed; rebuilding cli-proxy-api from source"
              docker compose build cli-proxy-api
            fi
            docker compose up -d --force-recreate cli-proxy-api

            # Health check: management endpoint requires auth, but /v1/models
            # is gated by api-key. We just verify the port answers.
            sleep 8
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8317/v1/models -H 'Authorization: Bearer healthcheck-probe' || true)
              if [ "$code" = "401" ] || [ "$code" = "200" ]; then
                echo "Health check ok (HTTP $code)"
                exit 0
              fi
              echo "Health check attempt $i: HTTP $code"
              sleep 5
            done
            echo "Health check failed"
            docker compose logs --tail 50 cli-proxy-api || true
            exit 1

  cleanup:
    name: Docker Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Prune via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: docker system prune -af --filter "until=24h"
