# ===================================================================================
# CLI Proxy API (ai-core2) - CI/CD PIPELINE
# ===================================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip build, deploy existing image'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cli-proxy-api

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_only != 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || github.event.inputs.deploy_only == 'true') &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Verify secrets
        run: |
          echo "  - VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY && 'Set' || 'Not set' }}"
          echo "  - GHCR_TOKEN: ${{ secrets.GHCR_TOKEN && 'Set' || 'Not set' }}"
          echo "  - ENV_FILE: ${{ secrets.ENV_FILE && 'Set' || 'Not set' }}"
          echo "  - CONFIG_YAML: ${{ secrets.CONFIG_YAML && 'Set' || 'Not set' }}"

      - name: Update ENV and CONFIG files on server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "Updating .env file on server..."
            printf '%s' "$ENV_FILE" | ssh $VPS_USER@$VPS_HOST "mkdir -p /home/$VPS_USER/genfity/ai-core2 && cat > /tmp/cliproxy.env && sudo install -m 600 -o root -g root /tmp/cliproxy.env /home/$VPS_USER/genfity/ai-core2/.env && rm -f /tmp/cliproxy.env"
          fi
          if [ -n "$CONFIG_YAML" ]; then
            echo "Updating config.yaml file on server..."
            printf '%s' "$CONFIG_YAML" | ssh $VPS_USER@$VPS_HOST "mkdir -p /home/$VPS_USER/genfity/ai-core2 && cat > /tmp/cliproxy.yaml && sudo install -m 600 -o root -g root /tmp/cliproxy.yaml /home/$VPS_USER/genfity/ai-core2/config.yaml && rm -f /tmp/cliproxy.yaml"
          fi

      - name: Deploy with Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "GHCR_TOKEN or github.token is required for deployment"
            exit 1
          fi

          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -e
            mkdir -p ~/genfity/ai-core2
            cd ~/genfity/ai-core2

            if [ -d .git ]; then
              git remote set-url origin https://x-access-token:${GHCR_TOKEN}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            elif [ -f docker-compose.yml ]; then
              echo "Deploy directory is not a git repository; using existing docker-compose.yml"
            else
              git clone https://x-access-token:${GHCR_TOKEN}@github.com/${{ github.repository }}.git .
            fi

            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            export CLI_PROXY_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:latest
            sudo -E docker compose pull cli-proxy-api
            sudo -E docker compose up -d --force-recreate cli-proxy-api

            sudo docker image prune -af --filter "until=24h" 2>/dev/null || true
          ENDSSH

      - name: Health Check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sleep 15
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            if curl -sf http://localhost:8317/healthz > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Health check failed!"
            sudo docker logs cli-proxy-api --tail 50
            exit 1
          ENDSSH
