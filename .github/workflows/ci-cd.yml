# ===================================================================================
# CLI Proxy API (ai-core2) - CI/CD PIPELINE
# ===================================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip build, deploy existing image'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cli-proxy-api

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_only != 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || github.event.inputs.deploy_only == 'true') &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 60\n  ServerAliveCountMax 10\n' >> ~/.ssh/config

      - name: Verify secrets
        run: |
          echo "  - VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY && 'Set' || 'Not set' }}"
          echo "  - GHCR_TOKEN: ${{ secrets.GHCR_TOKEN && 'Set' || 'Not set' }}"
          echo "  - ENV_FILE: ${{ secrets.ENV_FILE && 'Set' || 'Not set' }}"
          echo "  - CONFIG_YAML: ${{ secrets.CONFIG_YAML && 'Set' || 'Not set' }}"

      - name: Update ENV and CONFIG files on server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "Updating .env file on server..."
            printf '%s' "$ENV_FILE" | ssh $VPS_USER@$VPS_HOST "mkdir -p /home/$VPS_USER/genfity/ai-core2 && cat > /tmp/cliproxy.env && sudo install -m 600 -o root -g root /tmp/cliproxy.env /home/$VPS_USER/genfity/ai-core2/.env && rm -f /tmp/cliproxy.env"
          fi
          if [ -n "$CONFIG_YAML" ]; then
            echo "Updating config.yaml file on server..."
            printf '%s' "$CONFIG_YAML" | ssh $VPS_USER@$VPS_HOST "mkdir -p /home/$VPS_USER/genfity/ai-core2 && cat > /tmp/cliproxy.yaml && sudo install -m 600 -o root -g root /tmp/cliproxy.yaml /home/$VPS_USER/genfity/ai-core2/config.yaml && rm -f /tmp/cliproxy.yaml"
          fi

      - name: Deploy with Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          echo "Deploying CLI Proxy API with docker compose..."

          ssh $VPS_USER@$VPS_HOST << ENDSSH
            set -euo pipefail
            mkdir -p ~/genfity/ai-core2
            cd ~/genfity/ai-core2

            if [ -d .git ]; then
              # Force pull latest changes (override local, no conflicts)
              git remote set-url origin https://x-access-token:${GHCR_TOKEN}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
              git remote set-url origin https://github.com/${{ github.repository }}.git
            elif [ -f docker-compose.yml ]; then
              echo "Deploy directory is not a git repository; using existing docker-compose.yml"
            else
              git clone https://x-access-token:${GHCR_TOKEN}@github.com/${{ github.repository }}.git .
              git remote set-url origin https://github.com/${{ github.repository }}.git
            fi

            # Login to GHCR
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u mygads --password-stdin

            # Set image and deploy using docker compose
            export CLI_PROXY_IMAGE=ghcr.io/mygads/cli-proxy-api:latest

            # Pull latest image
            sudo -E docker compose pull

            # First attempt; if Docker networking/iptables is stale, restart Docker once and retry.
            if ! sudo -E docker compose up -d --force-recreate; then
              echo "docker compose up failed, restarting Docker daemon and retrying once..."
              sudo systemctl restart docker
              sleep 5
              sudo -E docker compose up -d --force-recreate
            fi

            # Wait for service to be ready
            echo "Waiting for service to be ready..."
            sleep 15

            # Check container status
            if ! sudo docker ps --filter "name=^/cli-proxy-api$" --filter "status=running" | grep -q cli-proxy-api; then
              echo "cli-proxy-api container is not running after deploy"
              sudo docker ps -a | grep cli-proxy-api || true
              sudo docker logs cli-proxy-api --tail 50 || true
              exit 1
            fi

            # Cleanup old images
            sudo docker image prune -af --filter "until=24h" 2>/dev/null || true

            echo "Deployment complete!"
          ENDSSH

      - name: Health Check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "Running health check..."
          sleep 15

          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            for i in {1..5}; do
              if curl -sf http://localhost:8317/healthz > /dev/null 2>&1; then
                echo "Health check passed!"
                sudo docker ps | grep cli-proxy-api
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 5
            done

            echo "Health check failed!"
            sudo docker logs cli-proxy-api --tail 50
            exit 1
          ENDSSH
