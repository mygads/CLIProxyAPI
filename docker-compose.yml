services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/mygads/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    env_file:
      - .env
    environment:
      DEPLOY: ${DEPLOY:-production}
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
    restart: unless-stopped
    networks:
      - genfity-network

networks:
  genfity-network:
    external: true
